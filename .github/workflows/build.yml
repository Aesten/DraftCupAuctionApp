name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test AuctionApp.Tests -c Release

      - name: Publish
        run: dotnet publish AuctionApp -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DraftCupAuction
          path: publish/DraftCupAuction.exe
